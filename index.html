<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>记账本</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部：本月概览 -->
    <header class="app-header">
      <div class="header-title">
        <h1>记账本 <span class="version">V1.0</span></h1>
        <span class="header-sub">本月概览</span>
      </div>
      <div class="month-summary">
        <div class="hs-item"><span>收入</span><b id="sumIncome">¥0.00</b></div>
        <div class="hs-item"><span>支出</span><b id="sumExpense">¥0.00</b></div>
        <div class="hs-item"><span>结余</span><b id="sumBalance">¥0.00</b></div>
      </div>
    </header>

    <main class="content">
      <!-- 视图：记账 -->
      <section class="view" id="view-record">
        <div class="list-toolbar">
          <div class="chips" id="typeFilter">
            <button class="chip active" data-filter="all" type="button">全部</button>
            <button class="chip" data-filter="expense" type="button">支出</button>
            <button class="chip" data-filter="income" type="button">收入</button>
          </div>
        </div>
        <div id="recordList"></div>
      </section>

      <!-- 视图：统计 -->
      <section class="view hidden" id="view-stats">
        <div class="period-toggle" id="periodToggle">
          <button class="pt-btn active" data-period="week" type="button">本周</button>
          <button class="pt-btn" data-period="month" type="button">本月</button>
          <button class="pt-btn" data-period="year" type="button">本年</button>
        </div>
        <div class="stats-summary">
          <div class="ss-card income"><span>收入</span><b id="statsIncome">¥0.00</b></div>
          <div class="ss-card expense"><span>支出</span><b id="statsExpense">¥0.00</b></div>
          <div class="ss-card balance"><span>结余</span><b id="statsBalance">¥0.00</b></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <h3>收支趋势</h3>
            <span class="hint" id="chartHint"></span>
          </div>
          <div class="chart" id="barChart"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <h3>分类占比</h3>
            <div class="chips" id="donutType">
              <button class="chip active" data-dtype="expense" type="button">支出</button>
              <button class="chip" data-dtype="income" type="button">收入</button>
            </div>
          </div>
          <div class="donut-wrap">
            <div class="donut" id="donut">
              <div class="donut-center" id="donutTotal"></div>
            </div>
            <div class="legend" id="donutLegend"></div>
          </div>
        </div>
      </section>

      <!-- 视图：分类 -->
      <section class="view hidden" id="view-categories">
        <div class="panel">
          <div class="panel-head">
            <h3>支出分类</h3>
            <button class="btn-small" data-add-cat="expense" type="button">＋ 添加</button>
          </div>
          <div id="catListExpense"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <h3>收入分类</h3>
            <button class="btn-small" data-add-cat="income" type="button">＋ 添加</button>
          </div>
          <div id="catListIncome"></div>
        </div>
      </section>

      <!-- 视图：设置 -->
      <section class="view hidden" id="view-settings">
        <div class="panel">
          <div class="panel-head">
            <h3>资金来源</h3>
            <button class="btn-small" id="btnAddSource" type="button">＋ 添加</button>
          </div>
          <div id="sourceList"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <h3>记账人</h3>
            <button class="btn-small" id="btnAddRecorder" type="button">＋ 添加</button>
          </div>
          <div id="recorderList"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>数据管理</h3></div>
          <div class="settings-actions">
            <button class="btn" id="btnExportExcel" type="button">导出 Excel</button>
            <button class="btn" id="btnImportExcel" type="button">导入 Excel</button>
            <button class="btn" id="btnExport" type="button">导出备份(JSON)</button>
            <button class="btn" id="btnImport" type="button">导入备份(JSON)</button>
            <button class="btn danger" id="btnClear" type="button">清空所有数据</button>
          </div>
          <p class="field-hint">
            Excel 列：日期时间、类型、金额、分类、资金来源、记账人、备注；支持 .xlsx / .csv。
            导入 Excel 为「追加」，导入 JSON 备份为「覆盖」。旧版 .xls 请先另存为 .xlsx。
          </p>
          <input type="file" id="fileImport" accept="application/json,.json" class="hidden" />
          <input type="file" id="fileImportExcel" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" class="hidden" />
        </div>
        <p class="about">个人记账本 V1.0 · 数据保存在本机 localStorage · Android 版工程见 android/</p>
      </section>
    </main>

    <!-- 底部导航 -->
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-tab="record" type="button"><span class="ti">✏️</span>记账</button>
      <button class="tab" data-tab="stats" type="button"><span class="ti">📊</span>统计</button>
      <button class="tab" data-tab="categories" type="button"><span class="ti">🏷️</span>分类</button>
      <button class="tab" data-tab="settings" type="button"><span class="ti">⚙️</span>设置</button>
    </nav>

    <button class="fab" id="fabAdd" type="button" title="记一笔">＋</button>
  </div>

  <!-- 记账弹窗 -->
  <div class="modal-mask hidden" id="modalMask">
    <div class="modal" id="modal">
      <div class="modal-head">
        <h2 id="modalTitle">记一笔</h2>
        <button class="close" id="modalClose" type="button">×</button>
      </div>
      <div class="modal-body">
        <div class="form-type-toggle" id="typeToggle">
          <button class="ft-btn active" data-type="expense" type="button">支出</button>
          <button class="ft-btn" data-type="income" type="button">收入</button>
        </div>

        <div class="amount-row">
          <span class="currency">¥</span>
          <input type="number" id="fAmount" placeholder="0.00" inputmode="decimal" step="0.01" min="0" />
        </div>

        <div class="form-group">
          <label>分类</label>
          <div class="choice-grid" id="fCategory"></div>
        </div>

        <div class="form-group">
          <label>日期时间</label>
          <input type="datetime-local" id="fDateTime" />
        </div>

        <div class="form-group">
          <label>资金来源</label>
          <div class="choice-grid" id="fSource"></div>
        </div>

        <div class="form-group">
          <label>记账人</label>
          <div class="choice-grid" id="fRecorder"></div>
        </div>

        <div class="form-group">
          <label>备注</label>
          <input type="text" id="fNote" maxlength="60" placeholder="可选，如：午饭、打车" />
        </div>

        <div class="form-actions">
          <button class="btn-delete-record hidden" id="btnDeleteRecord" type="button">删除</button>
          <button class="btn-primary" id="btnSaveRecord" type="button">保存</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="xlsx-lite.js"></script>
  <script src="app.js"></script>
</body>
</html>
