plugins {
    id 'com.android.application'
}

// 网页源码在工程上一级（money-tracker 根目录）
def webRootDir = new File(rootProject.projectDir, '..')

android {
    namespace 'com.example.jizhang'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.jizhang"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 每次构建前，自动把网页资源同步进 assets/www
tasks.register('syncWebAssets', Copy) {
    from(webRootDir) {
        include 'index.html', 'style.css', 'app.js', 'xlsx-lite.js'
    }
    into 'src/main/assets/www'
}

tasks.named('preBuild').configure {
    dependsOn 'syncWebAssets'
}
